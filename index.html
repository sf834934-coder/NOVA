<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#000;display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;background:linear-gradient(180deg,#2b1040 0%,#12121a 28%,#12121a 75%,#1a0a18 100%);padding:20px 22px 30px}
.logo{text-align:center;margin-top:10px}
.star{font-size:42px}
.logo b{font-size:52px;letter-spacing:3px}
.logo b i{font-style:normal;background:linear-gradient(90deg,#b04dff,#ff6a00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h1{text-align:center;font-size:43px;font-weight:900;margin-top:20px;line-height:1.15}
.sub{text-align:center;color:#8b8b9e;font-size:22px;font-weight:700;margin-top:4px}
.new{text-align:center;color:#f5a623;font-size:21px;font-weight:800;text-decoration:underline;text-underline-offset:6px;margin:14px 0 22px;cursor:pointer}
.box{background:#1a1a22;border:1px solid #3a3a44;border-radius:24px;display:flex;align-items:center;gap:10px;padding:15px 16px;margin-bottom:14px}
.box input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:19px;font-weight:600}
.box input::placeholder{color:#8b8b9e}
.icon{width:38px;height:38px;border-radius:50%;background:#2a2a33;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.code-btn{background:linear-gradient(90deg,#ff7a00,#ff9a2a);color:#fff;border:none;padding:11px 18px;border-radius:14px;font-size:17px;font-weight:800;cursor:pointer;white-space:nowrap}
.check-row{display:flex;align-items:center;gap:12px;margin:16px 2px;font-size:19px;font-weight:600;color:#d8d8de}
.check-row input{width:24px;height:24px;accent-color:#f5a623;flex-shrink:0}
.check-row a{color:#f5a623;text-decoration:underline}
.hint{color:#8b8b9e;font-size:17px;margin:-6px 12px 16px;font-weight:600}
.login{width:100%;border:none;padding:18px;border-radius:22px;font-size:23px;font-weight:900;color:#fff;background:linear-gradient(90deg,#7b2ff7,#c026d3,#ff6a00);cursor:pointer;margin-top:6px;box-shadow:0 10px 30px rgba(124,58,237,.4)}
.footer{text-align:center;color:#8b8b9e;font-size:16px;margin-top:16px}
.footer b{color:#c9c9d1}
.msg{text-align:center;padding:10px;border-radius:12px;margin-bottom:12px;display:none;font-weight:700}
.ok{background:#14532d;color:#dcfce7}
.err{background:#7f1d1d;color:#fecaca}
#main{display:none;padding:20px;text-align:center}
#main h2{font-size:32px;margin:20px 0}
.card{background:#1a1a22;border:1px solid #333;border-radius:18px;padding:16px;margin:12px 0;text-align:right}
</style>
</head>
<body>
<div class="app" id="loginPage">
<div class="logo"><div class="star">⭐</div><b>N<i>OVA</i></b></div>
<h1>مرحبا بك<br>في نوفا</h1>
<div class="sub">تسجيل دخول</div>
<div class="new" onclick="alert('انشاء حساب جديد - نفس صفحة التسجيل')">هل تريد إنشاء حساب جديد؟</div>
<div class="msg" id="msg"></div>

<!-- البريد -->
<div class="box"><span class="icon">✉️</span><input id="email" type="email" placeholder="البريد الإلكتروني"><button class="code-btn" onclick="sendCode()">إرسال كود</button></div>

<!-- رمز التحقق -->
<div class="box"><span class="icon">🛡️</span><input id="code" type="text" placeholder="رمز التحقق"></div>

<label class="check-row"><input type="checkbox" id="human"> أنا إنسان حقيقي</label>
<label class="check-row"><input type="checkbox" id="terms"> أوافق على <a href="#" onclick="return false">شروط وخصوصية نوفا ...</a></label>

<!-- كلمة المرور -->
<div class="box"><span class="icon">🔒</span><input id="pass" type="password" placeholder="كلمة المرور"></div>
<div class="hint">أرقام، حروف، رموز</div>

<button class="login" onclick="login()">تسجيل الدخول</button>
<div class="footer">بالتسجيل، أنت توافق على <b>سياسة الاستخدام</b></div>
</div>

<div class="app" id="main" style="display:none">
<div class="logo"><div class="star">⭐</div><b>N<i>OVA</i></b></div>
<h2>أهلا بيك في نوفا 🎉</h2>
<p style="color:#aaa">تم تسجيل دخولك بنجاح</p>
<div class="card"><b>🏠 القائمة</b><br><span style="color:#aaa">منشورات، ستوريات، اصدقاء</span></div>
<div class="card"><b>💬 المحادثات</b><br><span style="color:#aaa">دردش مع اصدقائك</span></div>
<div class="card"><b>👤 حسابي</b><br><span style="color:#aaa" id="myEmail"></span></div>
<button class="login" onclick="location.reload()">تسجيل خروج</button>
</div>

<script>
let realCode="";
function show(t,ok){let m=document.getElementById('msg');m.style.display='block';m.className='msg '+(ok?'ok':'err');m.textContent=t}
function sendCode(){
let e=document.getElementById('email').value.trim();
if(!e.includes('@')){show('اكتب ايميل صحيح اولاً',false);return}
realCode=String(Math.floor(100000+Math.random()*900000));
show('تم ارسال الكود: '+realCode+' - انسخه والصقه في رمز التحقق',true);
document.getElementById('code').value=realCode;
}
function login(){
let e=document.getElementById('email').value.trim();
let c=document.getElementById('code').value.trim();
let p=document.getElementById('pass').value;
if(!e.includes('@')){show('اكتب ايميلك',false);return}
if(!realCode){show('دوس ارسال كود اولاً',false);return}
if(c!==realCode){show('رمز التحقق غلط',false);return}
if(!document.getElementById('human').checked){show('دوس على - أنا إنسان حقيقي',false);return}
if(!document.getElementById('terms').checked){show('لازم توافق على شروط وخصوصية نوفا',false);return}
if(p.length<6||!/[0-9]/.test(p)||!/[A-Za-z]/.test(p)){show('كلمة المرور لازم بيها أرقام وحروف ورموز، 6+ احرف',false);return}
document.getElementById('loginPage').style.display='none';
document.getElementById('main').style.display='block';
document.getElementById('myEmail').textContent=e;
}
</script>
</body>
</html>
