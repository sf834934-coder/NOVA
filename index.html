
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10131c;color:#f4f5f8;
 font-family:Arial,sans-serif
}
header{
 padding:18px;text-align:center;
 border-bottom:1px solid #292e3b;
 background:#171b26;position:sticky;top:0;z-index:5
}
.logo{font-size:30px;font-weight:bold;color:#65aaff;letter-spacing:3px}
.subtitle{font-size:12px;color:#929bb0;margin-top:5px}
main{max-width:600px;margin:auto;padding:15px}
.card{
 background:#1a1f2c;border:1px solid #2c3343;
 border-radius:16px;padding:15px;margin-bottom:14px
}
textarea{
 width:100%;resize:vertical;min-height:90px;
 background:#111622;color:white;border:1px solid #343b4d;
 border-radius:12px;padding:12px;font-size:16px
}
button{
 border:0;border-radius:10px;padding:10px 15px;
 cursor:pointer;font-size:15px
}
.primary{background:#438cff;color:white;font-weight:bold}
.nav{display:flex;gap:8px;margin:15px 0}
.nav button{flex:1;background:#252b39;color:#d7dbea}
.nav button.active{background:#438cff;color:white}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{
 width:40px;height:40px;border-radius:50%;
 background:#438cff;display:flex;align-items:center;
 justify-content:center;font-weight:bold
}
.name{font-weight:bold}
.time{color:#8f98aa;font-size:12px;margin-top:4px}
.post-text{font-size:16px;line-height:1.8;white-space:pre-wrap}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{background:#252b39;color:#e3e7f1}
.actions button.liked{color:#ff6e91}
.actions button.delete{color:#ff8585}
#search{
 width:100%;padding:12px;border-radius:10px;
 background:#111622;color:white;border:1px solid #343b4d;
 margin-bottom:12px;font-size:15px
}
.empty{text-align:center;color:#9ba4b8;padding:30px}
footer{text-align:center;color:#777f91;font-size:12px;padding:25px}
</style>
</head>
<body>
<header>
 <div class="logo">NOVA</div>
 <div class="subtitle">عالم يجمعنا باحترام</div>
</header>

<main>
 <div class="card">
  <textarea id="postInput" maxlength="1000"
   placeholder="شنو ببالك اليوم؟ شارك مجتمع نوفا..."></textarea>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
   <span style="color:#8993a8;font-size:12px">شارك بأدب واحترام ❤️</span>
   <button class="primary" id="publish">نشر</button>
  </div>
 </div>

 <div class="nav">
  <button class="active" data-tab="home">الرئيسية</button>
  <button data-tab="explore">استكشاف</button>
  <button data-tab="profile">منشوراتي</button>
 </div>

 <input id="search" placeholder="🔎 ابحث بالمنشورات...">
 <section id="feed"></section>
</main>

<footer>NOVA © 2026 — مجتمع يحترم الجميع</footer>

<script>
const feed = document.getElementById("feed");
const input = document.getElementById("postInput");
const search = document.getElementById("search");

let tab = "home";
let posts = JSON.parse(localStorage.getItem("nova_posts") || "[]");

function save(){
 localStorage.setItem("nova_posts",JSON.stringify(posts));
}

function safe(text){
 return String(text).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
 });
}

function render(){
 const q = search.value.trim().toLowerCase();
 let list = [...posts];

 if(tab==="profile") list=list.filter(p=>p.mine);
 if(tab==="explore") list.reverse();

 list=list.filter(p=>p.text.toLowerCase().includes(q));

 if(!list.length){
  feed.innerHTML='<div class="card empty">ماكو منشورات هنا حالياً 🌙</div>';
  return;
 }

 feed.innerHTML=list.map(p=>`
  <article class="card">
   <div class="post-head">
    <div class="avatar">N</div>
    <div>
     <div class="name">${safe(p.name)}</div>
     <div class="time">${safe(p.time)}</div>
    </div>
   </div>
   <div class="post-text">${safe(p.text)}</div>
   <div class="actions">
    <button class="${p.liked?'liked':''}" data-like="${p.id}">
     ${p.liked?'❤️':'🤍'} ${p.likes||0}
    </button>
    <button data-report="${p.id}">⚑ إبلاغ</button>
    ${p.mine?`<button class="delete" data-delete="${p.id}">🗑 حذف</button>`:''}
   </div>
  </article>
 `).join("");
}

document.getElementById("publish").onclick=()=>{
 const text=input.value.trim();
 if(!text)return;
 posts.unshift({
  id:Date.now(),name:"مستخدم نوفا",text,
  time:new Date().toLocaleString("ar-IQ"),
  likes:0,liked:false,mine:true
 });
 save();input.value="";render();
};

document.querySelectorAll(".nav button").forEach(btn=>{
 btn.onclick=()=>{
  tab=btn.dataset.tab;
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");render();
 };
});

search.oninput=render;

feed.onclick=(e)=>{
 const like=e.target.closest("[data-like]");
 const del=e.target.closest("[data-delete]");
 const report=e.target.closest("[data-report]");

 if(like){
  const p=posts.find(x=>x.id==like.dataset.like);
  if(p){
   p.liked=!p.liked;
   p.likes=Math.max(0,(p.likes||0)+(p.liked?1:-1));
   save();render();
  }
 }

 if(del){
  if(confirm("متأكد تريد تحذف المنشور؟")){
   posts=posts.filter(x=>x.id!=del.dataset.delete);
   save();render();
  }
 }

 if(report){
  alert("وصل بلاغك بشكل تجريبي. نظام البلاغات الحقيقي نضيفه لاحقاً.");
 }
};

render();
</script>
</body>
</html>
