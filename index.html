<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>
<style>
*{box-sizing:border-box}
body{ margin:0; background:#10131c; color:#f4f5f8; font-family:Arial,sans-serif; }
header{ padding:18px; text-align:center; background:#171b26; border-bottom:1px solid #292f40; }
header h1{margin:0;color:#65aaff}
header p{color:#aeb8ca;margin:8px 0 0}
nav{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:12px; background:#171b26; }
button{ border:0; border-radius:10px; padding:11px 15px; background:#293449; color:white; cursor:pointer; }
button.active,button.primary{ background:#347fc9; }
main{ max-width:850px; margin:auto; padding:15px; }
.page{display:none}
.page.active{display:block}
.card{ background:#191f2d; border:1px solid #293247; border-radius:14px; padding:15px; margin-bottom:14px; }
input,textarea,select{ width:100%; padding:12px; margin:7px 0; border-radius:9px; border:1px solid #39445a; background:#101722; color:white; font-size:15px; }
textarea{min-height:90px;resize:vertical}
h2{color:#65aaff}
small,.muted{color:#aeb8ca}
.post{white-space:pre-wrap;line-height:1.7}
footer{ text-align:center; padding:20px; color:#aeb8ca; }
#chat .card{ padding:0; overflow:hidden; border:1px solid #3a2a5a; }
#chat h2{ margin:0; padding:16px; text-align:center; color:white; background:linear-gradient(135deg,#6a1b9a,#ff6a00); border-radius:14px 14px 0 0; }
#chat #friendName{ margin:12px; width:calc(100% - 24px); }
#chat .card > button{ margin:0 12px 12px; }
#chatBox{ background:#1a1030; padding:12px; border-radius:0 0 14px 14px; }
#chatTitle{ margin:0 0 12px 0; padding:14px; text-align:center; color:white; background:linear-gradient(135deg,#7b1fa2,#ff7a00); border-radius:10px; font-size:17px; box-shadow:0 4px 14px rgba(255,106,0,.25); }
#messages{ display:flex; flex-direction:column; gap:10px; max-height:380px; overflow-y:auto; padding:4px; }
.message{ background:#2a1a4a; border-radius:6px; padding:12px 14px; margin:0; max-width:85%; align-self:flex-start; color:#fff; line-height:1.7; border-right:3px solid #ff6a00; box-shadow:0 2px 8px rgba(0,0,0,.25); white-space:pre-wrap; }
.message:nth-child(even){ background:#3a1a1a; align-self:flex-end; border-right:none; border-left:3px solid #a855f7; }
.message button{ display:block; margin-top:8px; background:#ff6a00; font-size:13px; padding:7px 10px; border-radius:6px; }
#messageText{ background:#22153a; border:1px solid #4a2a6a; color:white; min-height:55px; border-radius:12px; }
#chatBox > button:last-child{ background:linear-gradient(135deg,#7b1fa2,#ff6a00); width:56px; height:56px; border-radius:50%; font-size:18px; font-weight:bold; box-shadow:0 0 18px rgba(255,106,0,.6); margin:auto; display:block; }
.hidden{ display:none !important; }
</style>
</head>
<body>
<header>
<h1>NOVA</h1>
<p>عالم يجمعنا باحترام</p>
</header>
<nav>
<button class="active" onclick="showPage('home',this)">الرئيسية</button>
<button onclick="showPage('explore',this)">استكشاف</button>
<button onclick="showPage('chat',this)">الدردشة</button>
<button onclick="showPage('profile',this)">ملفي الشخصي</button>
<button onclick="showPage('voiceSettings',this)">الصوت واللغة</button>
<button onclick="showPage('contact',this)">تواصل معنا</button>
</nav>
<main>
<section id="home" class="page active">
<div class="card">
<h2>الاستوريات</h2>
<div id="stories">لا توجد استوريات حالياً</div>
</div>
<div class="card">
<h2>ما يخطر ببالك اليوم؟</h2>
<textarea id="postText" placeholder="شارك مجتمع نوفا..."></textarea>
<button class="primary" onclick="publishPost()">نشر</button>
</div>
<div id="posts"></div>
</section>
<section id="explore" class="page">
<div class="card">
<h2>استكشاف</h2>
<input id="searchText" placeholder="ابحث عن منشور">
<button onclick="searchPosts()">بحث</button>
</div>
<div id="searchResults"></div>
</section>
<section id="chat" class="page">
<div class="card">
<h2>الدردشة</h2>
<input id="friendName" placeholder="اسم المستخدم">
<button onclick="openChat()">فتح المحادثة</button>
<div id="chatBox" class="hidden">
<h3 id="chatTitle">المحادثة</h3>
<div id="messages"></div>
<textarea id="messageText" placeholder="اكتب رسالتك"></textarea>
<button onclick="sendMessage()">➤ إرسال</button>
</div>
</div>
</section>
<section id="profile" class="page">
<div class="card">
<h2>ملفي الشخصي</h2>
<input id="nameInput" placeholder="اسمك">
<button onclick="saveName()">حفظ الاسم</button>
<p>نقاطي: <span id="pointCount">0</span></p>
</div>
</section>
<section id="voiceSettings" class="page">
<div class="card">
<h2>إعدادات الصوت واللغة 🔊</h2>
<label>بلد المستخدم</label>
<select id="country">
<option value="IQ">العراق</option>
<option value="EG">مصر</option>
<option value="SA">السعودية</option>
<option value="KW">الكويت</option>
<option value="AE">الإمارات</option>
</select>
<label>لغة القراءة</label>
<select id="voiceLanguage">
<option value="ar">العربية</option>
<option value="en">English</option>
<option value="tr">Türkçe</option>
</select>
<label>اللهجة</label>
<select id="voiceDialect">
<option value="iraqi">العراقية</option>
<option value="egyptian">المصرية</option>
<option value="saudi">السعودية</option>
<option value="gulf">الخليجية</option>
<option value="formal">الفصحى</option>
</select>
<label>سرعة القراءة</label>
<input type="range" id="voiceSpeed" min="0.5" max="2" step="0.1" value="1">
<button class="primary" onclick="saveVoiceSettings()">حفظ الإعدادات</button>
<button onclick="testVoice()">تجربة الصوت</button>
<h3>إعدادات الإشعارات</h3>
<label><input type="checkbox" checked onchange="novaNotifications.enabled=this.checked;saveNotificationSettings()"> تشغيل الإشعارات</label><br><br>
<label><input type="checkbox" checked onchange="novaNotifications.sound=this.checked;saveNotificationSettings()"> تشغيل صوت الإشعارات</label><br><br>
<button onclick="saveNotificationSettings()"> حفظ إعدادات الإشعارات </button>
<button onclick="showNovaNotification('هذا إشعار تجريبي من نوفا')"> تجربة الإشعار </button>
<p id="voiceStatus" class="muted"></p>
</div>
</section>

<section id="contact" class="page">
<div class="card">
<h2>تواصل معنا 📩</h2>
<p class="muted">اكتب رسالتك وراح توصلي مباشرة على الايميل</p>
<form id="contact-form">
<input type="text" name="from_name" placeholder="اسمك" required>
<input type="email" name="from_email" placeholder="ايميلك" required>
<input type="hidden" name="to_name" value="NOVA">
<textarea name="message" placeholder="اكتب رسالتك هنا..." required></textarea>
<button class="primary" type="submit" id="contact-btn">ارسال الرسالة</button>
<p id="contact-status" class="muted"></p>
</form>
</div>
</section>

</main>
<script>
const defaults={ name:"", points:0, posts:[], stories:[], messages:{} };
let data;
try{ data=JSON.parse(localStorage.getItem("novaData"))||defaults; }catch(e){data=defaults;}
function save(){ localStorage.setItem("novaData",JSON.stringify(data)); updateProfile(); }
function showPage(id,btn){ document.querySelectorAll(".page").forEach(p=>{ p.classList.remove("active"); }); document.getElementById(id).classList.add("active"); document.querySelectorAll("nav button").forEach(b=>{ b.classList.remove("active"); }); btn.classList.add("active"); }
function publishPost(){ let input=document.getElementById("postText"); let text=input.value.trim(); if(!text)return; data.posts.unshift({ name:data.name||"عضو نوفا", text:text, time:new Date().toLocaleString("ar") }); data.points+=2; input.value=""; save(); renderPosts(); }
function renderPosts(){ let box=document.getElementById("posts"); box.innerHTML=""; data.posts.forEach(p=>{ let card=document.createElement("div"); card.className="card"; card.textContent=p.name+" : "+p.text; box.appendChild(card); }); }
function searchPosts(){ let q=document.getElementById("searchText").value.toLowerCase(); let box=document.getElementById("searchResults"); box.innerHTML=""; data.posts.filter(p=>p.text.toLowerCase().includes(q)).forEach(p=>{ let el=document.createElement("div"); el.className="card"; el.textContent=p.name+" : "+p.text; box.appendChild(el); }); }
function openChat(){ let name=document.getElementById("friendName").value.trim(); if(!name)return; data.messages[name]=data.messages[name]||[]; document.getElementById("chatBox").classList.remove("hidden"); document.getElementById("chatTitle").textContent="محادثة "+name; renderMessages(name); }
function renderMessages(name){ let box=document.getElementById("messages"); box.innerHTML=""; (data.messages[name]||[]).forEach(m=>{ let el=document.createElement("div"); el.className="message"; el.textContent=m.text; let read=document.createElement("button"); read.textContent="🔊 اقرأ بصوت"; read.onclick=()=>speakText(m.text); el.appendChild(read); box.appendChild(el); }); }
function sendMessage(){ let name=document.getElementById("friendName").value.trim(); let input=document.getElementById("messageText"); let text=input.value.trim(); if(!name||!text)return; data.messages[name]=data.messages[name]||[]; data.messages[name].push({text:text}); data.points++; input.value=""; save(); renderMessages(name); }
function saveName(){ let name=document.getElementById("nameInput").value.trim(); if(!name)return; data.name=name; save(); }
function updateProfile(){ document.getElementById("pointCount").textContent=data.points; document.getElementById("nameInput").value=data.name||""; }
function saveVoiceSettings(){ let settings={ country:document.getElementById("country").value, language:document.getElementById("voiceLanguage").value, dialect:document.getElementById("voiceDialect").value, speed:document.getElementById("voiceSpeed").value }; localStorage.setItem("novaVoiceSettings",JSON.stringify(settings)); document.getElementById("voiceStatus").textContent="تم حفظ إعدادات الصوت بنجاح"; }
function speakText(text){ if(!("speechSynthesis" in window)){ alert("الصوت غير مدعوم بهذا الجهاز"); return; } let settings=JSON.parse(localStorage.getItem("novaVoiceSettings")||"{}"); let speech=new SpeechSynthesisUtterance(text); speech.lang=settings.language==="en"?"en-US":"ar"; speech.rate=Number(settings.speed)||1; speechSynthesis.cancel(); speechSynthesis.speak(speech); }
function testVoice(){ speakText("مرحباً بك في نوفا، عالم يجمعنا باحترام"); }
let novaNotifications = JSON.parse( localStorage.getItem("novaNotifications") || '{"enabled":true,"sound":true}' );
function saveNotificationSettings(){ localStorage.setItem( "novaNotifications", JSON.stringify(novaNotifications) ); }
function showNovaNotification(message){ if(!novaNotifications.enabled) return; alert("🔔 إشعار من NOVA\n" + message); if(novaNotifications.sound){ try{ let audio = new Audio( "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=" ); audio.play(); }catch(e){} } }
renderPosts(); updateProfile();
</script>
<div id="friendsPage" style="display:block; padding:15px;">
<h2 style="color:white;">الاصدقاء</h2>
<input id="searchBox" type="text" placeholder="ابحث باسم المستخدم @ali_123" style="width:100%; padding:12px; border-radius:10px; border:none; background:#2a2a2a; color:white; margin:10px 0;" oninput="doSearch()" />
<div id="results"></div>
<h3 style="color:white; margin-top:20px;">طلبات الصداقة</h3>
<div id="requests" style="background:#1a1a1a; padding:10px; border-radius:10px; color:#aaa;"> لا توجد طلبات حاليا </div>
</div>
<script>
let users = [ {name:"علي حسين", user:"ali_123"}, {name:"نوفا", user:"nova_ali"}, {name:"نور", user:"noor.2026"} ];
function doSearch(){ let val = document.getElementById("searchBox").value.toLowerCase().replace("@",""); let box = document.getElementById("results"); box.innerHTML = ""; if(val === "") return; let found = users.filter(u => u.user.toLowerCase().startsWith(val)); if(found.length === 0){ box.innerHTML = "<p style='color:#aaa;'>ما لگينا احد بهذا الاسم</p>"; return; } found.forEach(u => { box.innerHTML += ` <div style="background:#1a1a1a; padding:10px; border-radius:10px; margin:5px 0; display:flex; justify-content:space-between; align-items:center;"> <div> <b style="color:white;">${u.name}</b><br> <span style="color:#888;">@${u.user}</span> </div> <button onclick="addFriend('${u.user}')" style="background:#00c853; color:white; border:none; padding:8px 12px; border-radius:8px;">اضافة صديق</button> </div> `; }); }
function addFriend(user){ alert("تم ارسال طلب صداقة الى @" + user); }
</script>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
emailjs.init("uPGaDFUQFAKBYhQ3Z");
document.getElementById("contact-form").addEventListener("submit", function(e){
  e.preventDefault();
  var btn = document.getElementById("contact-btn");
  var status = document.getElementById("contact-status");
  btn.textContent = "جاري الارسال...";
  btn.disabled = true;
  emailjs.sendForm("service_cyoqi34", "template_r45tuhg", this)
    .then(function(){
      status.textContent = "تم ارسال رسالتك بنجاح ✅";
      document.getElementById("contact-form").reset();
      btn.textContent = "ارسال الرسالة";
      btn.disabled = false;
    }, function(){
      status.textContent = "صار خطأ، حاول مرة ثانية ❌";
      btn.textContent = "ارسال الرسالة";
      btn.disabled = false;
    });
});
</script>

</body>
</html>
