
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}
header {
  text-align: center;
  padding: 30px;
  color: #55d6be;
}
.container {
  max-width: 420px;
  margin: 30px auto;
  padding: 20px;
}
.box {
  background: #1e293b;
  padding: 25px;
  border-radius: 15px;
}
h1, h2 { color: #55d6be; text-align: center; }
input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 0;
  border-radius: 8px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 8px;
  background: #55d6be;
  color: #101827;
  font-size: 17px;
  font-weight: bold;
}
p { text-align: center; }
</style>
</head>
<body>
<header>
<h1>NOVA</h1>
<p>عالم يجمعنا</p>
</header>
<div class="container">
<div class="box">
<h2>مرحباً بك في NOVA</h2>
<p>سجّل دخولك أو أنشئ حساباً جديداً</p>
<input type="text" placeholder="اسم المستخدم">
<input type="email" placeholder="البريد الإلكتروني">
<input type="password" placeholder="كلمة المرور">
<button>تسجيل الدخول</button>
<button>إنشاء حساب جديد</button>
</div>
</div>
</body>
</html>

مرحبا، هذا أول تعديل لبرنامج نوفا.
