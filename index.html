
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#10131c;
 color:#f4f5f8;
 font-family:Arial,sans-serif;
}
header{
 padding:25px 15px;
 text-align:center;
 background:#171b26;
 border-bottom:1px solid #252c3b;
}
.logo{color:#65aaff;font-size:32px;font-weight:bold}
.subtitle{color:#aab3c4;margin-top:8px}
.container{max-width:600px;margin:auto;padding:20px}
.card{
 background:#171b26;
 border:1px solid #293143;
 border-radius:16px;
 padding:20px;
 margin:18px 0;
}
h2{margin-top:0}
input,textarea{
 width:100%;
 padding:14px;
 margin:9px 0;
 border:1px solid #343d50;
 border-radius:10px;
 background:#10131c;
 color:white;
 font-size:16px;
}
button{
 border:0;
 border-radius:10px;
 padding:13px 18px;
 cursor:pointer;
 font-size:16px;
}
.primary{
 background:#65aaff;
 color:#10131c;
 font-weight:bold;
 width:100%;
 margin-top:10px;
}
.switch{
 background:transparent;
 color:#65aaff;
 width:100%;
 margin-top:12px;
}
.message{color:#9ba8bd;text-align:center;margin-top:12px}
.hidden{display:none}
footer{text-align:center;color:#929bad;padding:25px}
</style>
</head>
<body>

<header>
 <div class="logo">NOVA</div>
 <div class="subtitle">عالم يجمعنا باحترام</div>
</header>

<div class="container">

<div class="card" id="authCard">
 <h2 id="formTitle">إنشاء حساب جديد</h2>
 <p class="message" id="formDescription">
 أهلاً بيك بنوفا، أنشئ حسابك وابدأ رحلتك.
 </p>

 <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email">

 <input id="password" type="password" placeholder="كلمة المرور" autocomplete="new-password">

 <button class="primary" id="submitBtn" onclick="submitForm()">
 إنشاء حساب
 </button>

 <button class="switch" id="switchBtn" onclick="switchMode()">
 عندك حساب؟ تسجيل الدخول
 </button>

 <p class="message" id="result"></p>
</div>

</div>

<footer>
 NOVA — عالم يجمعنا باحترام
</footer>

<script>
let isLogin=false;

function switchMode(){
 isLogin=!isLogin;
 document.getElementById("formTitle").textContent=
 isLogin?"تسجيل الدخول":"إنشاء حساب جديد";

 document.getElementById("formDescription").textContent=
 isLogin?"أهلاً بعودتك إلى نوفا.":"أهلاً بيك بنوفا، أنشئ حسابك وابدأ رحلتك.";

 document.getElementById("submitBtn").textContent=
 isLogin?"دخول":"إنشاء حساب";

 document.getElementById("switchBtn").textContent=
 isLogin?"ما عندك حساب؟ إنشاء حساب":"عندك حساب؟ تسجيل الدخول";

 document.getElementById("password").autocomplete=
 isLogin?"current-password":"new-password";

 document.getElementById("result").textContent="";
}

function submitForm(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const result=document.getElementById("result");

 if(!email||!password){
  result.textContent="يرجى إدخال البريد الإلكتروني وكلمة المرور.";
  return;
 }

 if(password.length<6){
  result.textContent="كلمة المرور لازم تكون 6 أحرف أو أكثر.";
  return;
 }

 result.textContent=isLogin
 ?"واجهة تسجيل الدخول جاهزة — سيتم ربط الحسابات في التحديث القادم."
 :"واجهة إنشاء الحساب جاهزة — سيتم تفعيل إنشاء الحسابات في التحديث القادم.";
}
</script>

</body>
</html>
