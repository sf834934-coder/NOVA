
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}
header {
  background: #182538;
  padding: 22px;
  text-align: center;
  border-bottom: 2px solid #55d6be;
}
header h1 {
  color: #55d6be;
  margin: 0;
  font-size: 32px;
}
header p {
  color: #cbd5e1;
}
.container {
  max-width: 600px;
  margin: 30px auto;
  padding: 20px;
}
.welcome {
  background: #1e293b;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
}
.welcome h2 {
  color: #55d6be;
}
.welcome p {
  line-height: 1.8;
}
button {
  background: #55d6be;
  color: #101827;
  border: none;
  padding: 13px 25px;
  border-radius: 8px;
  font-size: 17px;
  margin-top: 15px;
}
footer {
  text-align: center;
  color: #94a3b8;
  padding: 25px;
}
</style>
</head>
<body>
<header>
<h1>NOVA</h1>
<p>عالم يجمعنا</p>
</header>
<div class="container">
<div class="welcome">
<h2>مرحبا بك في NOVA</h2>
<p>منصة تواصل اجتماعي مبتكرة، تجمع الناس في بيئة آمنة ومحترمة للمشاركة والتفاعل والتواصل.</p>
<button>ابدأ الآن</button>
</div>
</div>
<footer>
جميع الحقوق محفوظة لـ NOVA
</footer>
</body>
</html>
