<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA</title>
<style>
:root{color-scheme:dark;--bg:#0d1018;--panel:#171c29;--line:#2b3448;--text:#f4f6fb;--muted:#aab3c5;--accent:#8b7cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
header{padding:16px;background:#121725;border-bottom:1px solid var(--line);position:sticky;top:0}
.brand{font-size:26px;font-weight:900;color:#a99dff;max-width:700px;margin:auto}
main{max-width:700px;margin:20px auto;padding:0 12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 12px}
textarea,input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f1420;color:white;font:inherit;margin:4px 0}
textarea{min-height:85px}
button{background:var(--accent);color:white;border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:bold;margin:5px 3px;cursor:pointer}
.secondary{background:#30394d}
.stories{display:flex;gap:12px;overflow:auto}
.story{text-align:center;min-width:70px;cursor:pointer}
.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(135deg,#8b7cff,#42d6bd);color:#10131d;font-weight:bold;font-size:22px}
small,.muted{color:var(--muted)}
.head{display:flex;gap:10px;align-items:center}
.post{white-space:pre-wrap;line-height:1.8;margin:14px 0}
.comment{padding:8px;background:#101521;border-radius:8px;margin-top:6px}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:16px}
.modal>div{max-width:420px;width:100%;background:var(--panel);padding:18px;border-radius:16px}
.note{text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header><div class="brand">NOVA ✦</div></header>
<main>

<section class="panel">
<h2>الستوريات</h2>
<div class="stories" id="stories"></div>
</section>

<section class="panel">
<h2>أضف ستوري</h2>
<textarea id="storyText" maxlength="240" placeholder="شنو تحب تشارك؟"></textarea>
<select id="privacy">
<option value="all">الكل</option>
<option value="followers">المتابعون</option>
<option value="selected">أشخاص محددون</option>
<option value="me">أنا فقط</option>
</select>
<input id="people" class="hidden" placeholder="أسماء الأشخاص، افصل بينها بفاصلة">
<button id="addStory">نشر الستوري</button>
<p class="muted">تنتهي الستوري بعد 24 ساعة. خيارات الجمهور واجهة تجريبية حالياً.</p>
</section>

<section class="panel">
<h2>منشور جديد</h2>
<textarea id="postText" placeholder="اكتب منشورك..."></textarea>
<button id="addPost">نشر</button>
</section>

<section id="feed"></section>
<p class="note">نسخة تجريبية: البيانات محفوظة على هذا الجهاز فقط، وليست مشتركة بين المستخدمين.</p>
</main>

<div id="modal" class="modal hidden">
<div>
<button id="close" class="secondary">إغلاق</button>
<h2 id="mt"></h2>
<p id="mb"></p>
<small id="mm"></small>
</div>
</div>

<script>
const $=x=>document.getElementById(x);
const read=(k)=>{
try{return JSON.parse(localStorage.getItem(k)||'[]')}
catch{return []}
};

let posts=read('nova_posts');
let stories=read('nova_stories');

const save=()=>{
localStorage.setItem('nova_posts',JSON.stringify(posts));
localStorage.setItem('nova_stories',JSON.stringify(stories));
};

const esc=s=>String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const when=t=>new Date(t).toLocaleString('ar-IQ');

function renderStories(){
stories=stories.filter(s=>Date.now()-s.time<86400000);
save();

$('stories').innerHTML=stories.length
?stories.map(s=>`
<div class="story" data-id="${s.id}">
<div class="avatar">ن</div>
<small>${esc(s.author)}</small>
</div>`).join('')
:'<p class="muted">ماكو ستوريات حالياً</p>';

document.querySelectorAll('.story').forEach(e=>{
e.onclick=()=>{
let s=stories.find(x=>x.id===e.dataset.id);
$('mt').textContent='ستوري '+s.author;
$('mb').textContent=s.text;
$('mm').textContent='نُشرت: '+when(s.time);
$('modal').classList.remove('hidden');
};
});
}

function renderPosts(){
$('feed').innerHTML=posts.slice().reverse().map(p=>`
<article class="panel">
<div class="head">
<div class="avatar">ن</div>
<div>
<b>${esc(p.author)}</b><br>
<small>${when(p.time)}</small>
</div>
</div>
<div class="post">${esc(p.text)}</div>
<button class="secondary" data-like="${p.id}">♥ ${p.likes}</button>
<button class="secondary" data-comment="${p.id}">تعليق</button>
<button class="secondary" data-del="${p.id}">حذف</button>
${p.comments.map(c=>`<div class="comment">${esc(c)}</div>`).join('')}
</article>`).join('')
||'<section class="panel muted">ماكو منشورات بعد. اكتب أول منشور!</section>';

document.querySelectorAll('[data-like]').forEach(b=>{
b.onclick=()=>{
let p=posts.find(x=>x.id===b.dataset.like);
p.likes++;
save();
renderPosts();
};
});

document.querySelector
